version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # Qdrant Vector Database (ColPali Multi-Vector Embeddings)
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: lexisgraph-qdrant
    ports:
      - "6333:6333" # REST API & Web UI
      - "6334:6334" # gRPC API
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
      - QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS=4
    volumes:
      - qdrant_storage:/qdrant/storage:z
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - lexisgraph-network

  # ----------------------------------------------------------------------------
  # Neo4j Knowledge Graph (Legal Entities & Hierarchical Relations)
  # ----------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.26.0-community
    container_name: lexisgraph-neo4j
    ports:
      - "7474:7474" # HTTP Browser UI
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-legalgraphpassword123}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allow__csv=apoc.*
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=512m
    volumes:
      - neo4j_data:/data:z
      - neo4j_logs:/logs:z
      - neo4j_plugins:/plugins:z
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - lexisgraph-network

  # ----------------------------------------------------------------------------
  # LexisGraph Application Server (FastAPI Core Pipeline)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lexisgraph-app
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - APP_ENV=development
      - HOST=0.0.0.0
      - PORT=8000
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_GRPC_PORT=6334
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-legalgraphpassword123}
    volumes:
      - .:/app:cached
      - app_data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lexisgraph-network

# ------------------------------------------------------------------------------
# Volumes & Networks Definition
# ------------------------------------------------------------------------------
volumes:
  qdrant_storage:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_plugins:
    driver: local
  app_data:
    driver: local

networks:
  lexisgraph-network:
    driver: bridge
